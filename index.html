markers.forEach(function(m) {
  var color = capeColor(m.cape);
  var icon = L.divIcon({
    html: '<div style="width:9px;height:9px;border-radius:50%;background:' + color +
          ';border:1px solid rgba(0,0,0,0.4);"></div>',
    iconSize: [9,9], iconAnchor: [4,4], className: ''
  });
  var marker = L.marker([m.lat, m.lon], {icon: icon}).addTo(map);
  marker.bindTooltip('CAPE: ' + m.cape.toFixed(0) + ' J/kg', {direction:'top', offset:[0,-5]});
  marker.on('click', function() {
    document.getElementById('skewt-img').src = m.png;
    document.getElementById('skewt-panel').style.display = 'block';
  });
});

infoBox.onAdd = function() {
  var div = L.DomUtil.create('div');
  div.style.cssText = 'background:rgba(255,255,255,0.93);padding:12px 16px;border-radius:8px;' +

    '<i style="color:#888;font-size:11px">This pipeline has since been updated by Dr. Goldberg\'s lab at CCNY/NOAA-CESSRST. Archived sample from Summer 2026.</i>';

};
infoBox.addTo(map);
